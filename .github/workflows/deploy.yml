name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages environment
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"

          if [ -n "${CUSTOM_SITE_URL}" ]; then
            echo "SITE_URL=${CUSTOM_SITE_URL}" >> "${GITHUB_ENV}"
          else
            echo "SITE_URL=https://${OWNER}.github.io" >> "${GITHUB_ENV}"
          fi

          if [ -n "${CUSTOM_BASE_PATH}" ]; then
            echo "BASE_PATH=${CUSTOM_BASE_PATH}" >> "${GITHUB_ENV}"
          elif [ "${REPOSITORY}" = "${OWNER}.github.io" ]; then
            echo "BASE_PATH=/" >> "${GITHUB_ENV}"
          else
            echo "BASE_PATH=/${REPOSITORY}" >> "${GITHUB_ENV}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
